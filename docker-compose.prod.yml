# Production stack for Vultr (or any VPS): Caddy + DDB app + Postgres + MinIO.
# Usage:
#   cp .env.prod.example .env.prod   # then edit secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# First boot: RUN_DB_PUSH=1 in .env.prod → confirm db push in logs → set 0 → recreate app.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # Internal scheduler: hits http://app:8080/api/cron/* (no Caddy / public DNS).
  cron:
    build: ./deploy/cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_BASE_URL: http://app:8080
      TZ: Asia/Taipei
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ddb
    volumes:
      - ddb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddb -d ddb"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Official minio/minio left Docker Hub (2026); use Chainguard public image.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ddb_minio:/data

  minio-init:
    image: bitnamilegacy/minio-client:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        MC=/opt/bitnami/minio-client/bin/mc
        sleep 4
        "$$MC" alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        "$$MC" mb local/ddb --ignore-existing
        echo MinIO bucket ddb ready
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

volumes:
  ddb_pgdata:
  ddb_minio:
  caddy_data:
  caddy_config:
